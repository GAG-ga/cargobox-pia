# Blueprint de Render (ADR-010): Web Service con Docker + PostgreSQL gestionado.
# En Render: New → Blueprint → seleccionar este repositorio.
services:
  - type: web
    name: cargobox-api
    runtime: docker
    plan: free
    healthCheckPath: /salud
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cargobox-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: EVIDENCIAS_DIR
        value: /tmp/evidencias

databases:
  - name: cargobox-db
    plan: free
    databaseName: cargobox
    user: cargobox
